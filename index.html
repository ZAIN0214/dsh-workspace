<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>学会 Python · 零基础一步一步学到能写程序</title>
<meta name="description" content="先摸底、再规划、然后一步步带着学，每一步都有反馈，学完还有测验。" />
<style>
  :root{
    --bg:#f4f6fb;
    --bg2:#eef1fa;
    --card:#ffffff;
    --card2:#fafbff;
    --ink:#171b28;
    --muted:#68708a;
    --line:#e6e9f4;
    --accent:#3b6fe0;
    --accent2:#6b8ff7;
    --accent-soft:#ecf1ff;
    --green:#0f9d76;
    --green-soft:#e6f7f1;
    --red:#d9534f;
    --red-soft:#fdeeee;
    --amber:#c98a1c;
    --amber-soft:#fff7e6;
    --radius:20px;
    --shadow:0 16px 40px -22px rgba(23,27,40,.28), 0 2px 8px -4px rgba(23,27,40,.06);
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 420px at 12% -8%, #e3ebff 0%, transparent 60%),
      radial-gradient(760px 380px at 92% 4%, #e8f6ef 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 20px 90px}
  h1,h2,h3{letter-spacing:-.3px;line-height:1.35}

  /* 顶栏 */
  .topbar{
    max-width:880px;margin:0 auto;padding:18px 20px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand .logo{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(140deg,#3b6fe0,#7c5cff);box-shadow:0 8px 18px -8px #3b6fe0;
  }
  .brand b{display:block;font-size:15px;line-height:1.2}
  .brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.5px}

  .btn{
    appearance:none;font:inherit;font-size:14px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:10px 18px;border-radius:12px;display:inline-flex;align-items:center;gap:7px;justify-content:center;
    transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:#cdd6ef;box-shadow:0 8px 20px -12px rgba(23,27,40,.25)}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),#6f5cf0);color:#fff;border:none;
    box-shadow:0 12px 26px -14px var(--accent);
  }
  .btn.primary:hover{box-shadow:0 16px 30px -14px var(--accent)}
  .btn.ghost{background:transparent}
  .btn.sm{font-size:12.5px;padding:7px 12px;border-radius:10px}
  .btn.big{font-size:15.5px;padding:14px 26px;border-radius:14px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .link{
    appearance:none;border:none;background:transparent;font:inherit;font-size:13.5px;color:var(--accent);
    cursor:pointer;padding:4px 0;text-decoration:none;display:inline-flex;align-items:center;gap:4px;
  }
  .link:hover{text-decoration:underline;text-underline-offset:3px}

  /* 步骤条 */
  .stepper-wrap{max-width:880px;margin:4px auto 0;padding:0 20px}
  .stepper{
    list-style:none;margin:0;padding:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  }
  .stepper li{
    display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;
  }
  .stepper li .no{
    width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
    background:var(--bg2);color:var(--muted);border:1px solid var(--line);
  }
  .stepper li.active{color:var(--accent);border-color:#c6d4ff;background:var(--accent-soft);font-weight:600}
  .stepper li.active .no{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stepper li.done{color:var(--green);border-color:#c6ecdd;background:var(--green-soft)}
  .stepper li.done .no{background:var(--green);color:#fff;border-color:var(--green)}
  .stepper .sep{flex:0 1 22px;height:1px;background:var(--line)}

  /* 屏幕 */
  .screen{animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* 首页 */
  .hero{padding:34px 0 8px;text-align:center}
  .hero .tagline{
    display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--accent);
    background:var(--accent-soft);border:1px solid #d3dfff;border-radius:99px;padding:5px 14px;
  }
  .hero h1{font-size:clamp(28px,4.4vw,42px);margin:18px 0 14px}
  .hero h1 em{
    font-style:normal;background:linear-gradient(115deg,var(--accent),#7c5cff 55%,#0f9d76);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .lead{color:var(--muted);font-size:15.5px;max-width:600px;margin:0 auto 26px}
  .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:44px 0 0;text-align:left}
  .feature{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .feature .ico{font-size:22px}
  .feature h3{margin:10px 0 6px;font-size:15px}
  .feature p{margin:0;font-size:13px;color:var(--muted);line-height:1.75}
  .feature .step-no{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px}
  .outline{margin-top:34px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .outline h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .outline h2 span{font-size:12px;color:var(--muted);font-weight:400}
  .outline ol{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
  .outline li{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:12px;font-size:13.5px}
  .outline li:hover{background:var(--card2)}
  .outline li .idx{
    flex:0 0 auto;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
    font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);
  }
  .outline li b{display:block;font-weight:600;font-size:13.5px}
  .outline li small{color:var(--muted);font-size:12px}

  /* 通用卡片 */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:28px;margin-top:18px;
  }
  .kicker{
    margin:0 0 8px;font-size:12px;letter-spacing:.6px;color:var(--muted);
    display:flex;align-items:center;gap:8px;text-transform:none;
  }
  .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

  /* 摸底 */
  .quiz-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .quiz-head .meta{font-size:12.5px;color:var(--muted)}
  .progress{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:6px 0 22px}
  .progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#7c5cff);transition:width .35s ease}
  .q-title{font-size:clamp(19px,2.6vw,23px);margin:4px 0 20px;font-weight:700}
  .q-hint{font-size:13px;color:var(--muted);margin:0 0 18px}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .opt{
    appearance:none;font:inherit;text-align:left;cursor:pointer;
    display:flex;align-items:flex-start;gap:12px;
    background:var(--card2);border:1.5px solid var(--line);border-radius:14px;
    padding:13px 16px;font-size:14.5px;color:var(--ink);line-height:1.6;
    transition:border-color .18s ease,background .18s ease,transform .15s ease;
  }
  .opt .key{
    flex:0 0 auto;width:23px;height:23px;border-radius:7px;display:grid;place-items:center;
    font-size:11.5px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--muted);margin-top:1px;
  }
  .opt:hover:not(.static){border-color:#b9c9f2;background:#f5f8ff;transform:translateX(2px)}
  .opt.selected{border-color:var(--accent);background:var(--accent-soft)}
  .opt.selected .key{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt.right{border-color:#8fd9bf;background:var(--green-soft)}
  .opt.right .key{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{border-color:#f0b8b6;background:var(--red-soft)}
  .opt.wrong .key{background:var(--red);border-color:var(--red);color:#fff}
  .opt.static{cursor:default}
  .opt.dim{opacity:.62}

  /* 反馈块 */
  .feedback{border-radius:16px;padding:18px 20px;margin-top:18px;border:1px solid transparent}
  .feedback.ok{background:var(--green-soft);border-color:#c9eddf}
  .feedback.bad{background:var(--red-soft);border-color:#f6d2d0}
  .feedback .fb-title{margin:0 0 6px;font-weight:700;font-size:14.5px}
  .feedback.ok .fb-title{color:var(--green)}
  .feedback.bad .fb-title{color:var(--red)}
  .feedback p{margin:0 0 8px;font-size:13.8px;color:#3a4256}
  .feedback .btn{margin-top:8px}

  /* 简化解释 */
  .simple{
    margin-top:16px;background:var(--amber-soft);border:1px solid #f6e3b8;border-radius:14px;
    padding:14px 16px;font-size:13.6px;color:#6b5320;line-height:1.8;
  }
  .simple b{color:#8a6a12}

  /* 代码 */
  .code{
    background:#0f1626;color:#e6ecff;border-radius:14px;padding:16px 18px;margin:16px 0 0;
    font-family:var(--mono);font-size:13.5px;line-height:1.75;overflow-x:auto;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .code code{font-family:inherit;white-space:pre}
  .out{
    margin-top:0;background:#12203a;border-radius:0 0 14px 14px;padding:12px 18px;
    border-top:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:flex-start;
  }
  .out + .simple{margin-top:16px}
  .out .out-label{
    flex:0 0 auto;font-size:11px;color:#8fe3c2;background:rgba(143,227,194,.12);
    padding:2px 8px;border-radius:6px;margin-top:3px;letter-spacing:.5px;
  }
  .out pre{
    margin:0;font-family:var(--mono);font-size:13px;color:#b9f5dd;white-space:pre-wrap;word-break:break-word;
  }
  .code-wrap{margin:16px 0 0}
  .code-wrap .code{margin:0;border-radius:14px 14px 0 0}

  /* 报告 */
  .report-hero{text-align:center;padding:6px 0 4px}
  .level-badge{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
    border-radius:99px;padding:6px 16px;margin-bottom:14px;
  }
  .level-badge.zero{background:var(--accent-soft);color:var(--accent)}
  .level-badge.mid{background:var(--amber-soft);color:var(--amber)}
  .level-badge.high{background:var(--green-soft);color:var(--green)}
  .report-hero h1{font-size:clamp(23px,3.4vw,32px);margin:0 0 10px}
  .report-hero p{color:var(--muted);font-size:14.5px;max-width:560px;margin:0 auto}
  .skill-list{display:grid;gap:14px;margin-top:6px}
  .skill{display:flex;flex-direction:column;gap:6px}
  .skill .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px}
  .skill .row b{font-weight:600}
  .skill .row .lv{font-size:12px;font-weight:700}
  .skill .row .lv.zero{color:var(--red)}
  .skill .row .lv.mid{color:var(--amber)}
  .skill .row .lv.high{color:var(--green)}
  .skill .bar{height:7px;border-radius:99px;background:var(--bg2);overflow:hidden}
  .skill .bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .skill .bar i.zero{background:linear-gradient(90deg,#f0a6a2,#e2575b)}
  .skill .bar i.mid{background:linear-gradient(90deg,#f4cf7a,#e0a02c)}
  .skill .bar i.high{background:linear-gradient(90deg,#7fe0bb,#12a97c)}
  .plan{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
  .plan li{
    display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;
    background:var(--card2);border:1px solid var(--line);
  }
  .plan li .no{
    flex:0 0 auto;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
    font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--muted);
  }
  .plan li .body{flex:1;min-width:0}
  .plan li .body b{font-size:13.8px;display:block}
  .plan li .body small{font-size:12px;color:var(--muted)}
  .plan li .tag{flex:0 0 auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;align-self:center}
  .tag.focus{background:var(--red-soft);color:var(--red)}
  .tag.normal{background:var(--accent-soft);color:var(--accent)}
  .tag.fast{background:var(--green-soft);color:var(--green)}
  .tag.done{background:var(--green-soft);color:var(--green)}
  .plan-summary{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
  .plan-summary b{color:var(--ink)}

  /* 课程列表 */
  .lesson-list{display:grid;gap:12px;margin-top:6px}
  .lesson-item{
    display:flex;gap:16px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
    box-shadow:var(--shadow);cursor:pointer;
    transition:transform .18s ease,border-color .2s ease,box-shadow .2s ease;
  }
  .lesson-item:hover{transform:translateY(-2px);border-color:#c9d5f5;box-shadow:0 20px 36px -22px rgba(23,27,40,.3)}
  .lesson-item .no{
    flex:0 0 auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
    font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--accent);
  }
  .lesson-item.finished .no{background:var(--green-soft);color:var(--green)}
  .lesson-item .body{flex:1;min-width:0}
  .lesson-item .body b{font-size:15px;display:block}
  .lesson-item .body small{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
  .lesson-item .right{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .lesson-item .right .mi{font-size:11.5px;color:var(--muted)}
  .lesson-item .right .pct{font-size:12.5px;font-weight:700;color:var(--green)}
  .course-overview{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .course-overview h1{font-size:clamp(22px,3.2vw,28px);margin:0}
  .course-overview p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
  .overall{min-width:150px;text-align:right;font-size:12.5px;color:var(--muted)}
  .overall b{display:block;font-size:22px;color:var(--ink)}

  /* 上课 */
  .lesson-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .lesson-top .steps-ind{font-size:12.5px;color:var(--muted)}
  .lesson-progress{height:5px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:2px 0 18px}
  .lesson-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7c5cff);border-radius:99px;transition:width .35s}
  .lesson-title{font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.4px}
  .card-stage h2{font-size:clamp(20px,2.8vw,25px);margin:0 0 14px}
  .card-stage p{margin:0 0 12px;font-size:15.5px;line-height:1.9}
  .card-stage p b{background:linear-gradient(transparent 62%,#d9e4ff 0);padding:0 2px}
  .check{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}
  .check h3{font-size:15.5px;margin:6px 0 0}

  /* 提问 */
  .asks{display:grid;gap:9px;margin-top:6px}
  .ask{border:1px solid var(--line);border-radius:14px;background:var(--card2);overflow:hidden}
  .ask summary{
    cursor:pointer;list-style:none;padding:13px 16px;font-size:14px;font-weight:600;color:var(--ink);
    display:flex;justify-content:space-between;gap:12px;align-items:center;
  }
  .ask summary::-webkit-details-marker{display:none}
  .ask summary::after{content:"＋";color:var(--accent);font-weight:400;font-size:16px}
  .ask[open] summary::after{content:"－"}
  .ask[open] summary{color:var(--accent)}
  .ask .answer{padding:0 16px 15px;font-size:13.6px;color:#414a61;line-height:1.85;border-top:1px solid var(--line);margin-top:0;padding-top:12px}

  /* 小结 */
  .summary-box{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:18px}
  .summary-box h3{margin:0 0 10px;font-size:14.5px}
  .summary-box ul{margin:0;padding-left:20px;font-size:14px;line-height:1.85}
  .summary-box li{margin:4px 0}

  /* 完成 */
  .done-hero{text-align:center;padding:10px 0}
  .score-ring{
    width:150px;height:150px;border-radius:50%;margin:8px auto 16px;display:grid;place-items:center;
    background:conic-gradient(var(--green) calc(var(--p,0) * 1%),#eef1f8 0);
  }
  .score-ring .in{
    width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .score-ring .in b{font-size:30px;line-height:1.1}
  .score-ring .in span{font-size:11px;color:var(--muted);display:block}
  .done-hero h1{font-size:clamp(22px,3.2vw,30px);margin:6px 0 8px}
  .done-hero p{color:var(--muted);font-size:14.5px;max-width:520px;margin:0 auto 6px}
  .review-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:9px}
  .review-list li{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card2)}
  .review-list .rq{font-size:13.8px;font-weight:600;margin:0 0 6px;display:flex;gap:8px;align-items:flex-start}
  .review-list .rq .mark{flex:0 0 auto}
  .review-list .ra{font-size:12.8px;color:var(--muted);margin:2px 0 0}
  .review-list .ra b{color:var(--ink);font-weight:600}
  .review-list .explain{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.8}
  .review-list .right{border-color:#c9eddf}
  .review-list .wrong{border-color:#f6d2d0}

  /* 其它 */
  .note{font-size:12.5px;color:var(--muted);margin:14px 0 0}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  .actions.right{justify-content:flex-end}
  .divider{height:1px;background:var(--line);margin:22px 0}
  .center{text-align:center}
  .mt24{margin-top:24px}
  .footer{margin-top:48px;text-align:center;font-size:12px;color:#9aa2b8}

  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:99;
    background:#171b28;color:#fff;font-size:13px;padding:10px 18px;border-radius:12px;
    opacity:0;pointer-events:none;transition:all .25s ease;box-shadow:0 16px 34px -14px rgba(0,0,0,.4);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:720px){
    .feature-grid{grid-template-columns:1fr}
    .card{padding:22px 18px}
    .hero{padding-top:24px}
    .lesson-item{padding:16px}
    .stepper .sep{display:none}
    .course-overview{flex-direction:column;align-items:flex-start}
    .overall{text-align:left}
    .plan li .tag{align-self:flex-start}
  }
  @media (max-width:480px){
    .topbar{padding:14px 16px 6px}
    .brand small{display:none}
    .wrap{padding:0 16px 70px}
    .stepper-wrap{padding:0 16px}

var KEY = "py-learn-v1";
var lock = false;

function defaultState() {
  return {
    stage: "welcome",
    diag: { idx: 0, answers: {} },
    diagCompleted: false,
    lesson: null,
    records: {},
    final: { idx: 0, answers: {}, submitted: false }
  };
}

function loadState() {
  var base = defaultState();
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return base;
    var s = JSON.parse(raw);
    if (!s || typeof s !== "object") return base;
    if (["welcome", "diagnose", "report", "lessons", "lesson", "final", "result"].indexOf(s.stage) >= 0) base.stage = s.stage;
    if (s.diag && typeof s.diag === "object") {
      base.diag = { idx: Math.min(s.diag.idx || 0, DIAG.length - 1), answers: s.diag.answers || {} };
    }
    base.diagCompleted = !!s.diagCompleted;
    base.lesson = s.lesson && typeof s.lesson === "object" ? s.lesson : null;
    base.records = s.records && typeof s.records === "object" ? s.records : {};
    if (s.final && typeof s.final === "object") {
      base.final = {
        idx: Math.min(s.final.idx || 0, FINAL.length - 1),
        answers: s.final.answers || {},
        submitted: !!s.final.submitted
      };
    }
    if (base.stage === "lesson" && !base.lesson) base.stage = "lessons";
    return base;
  } catch (e) { return base; }
}

var state = loadState();

function saveState() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 无痕模式忽略 */ }
}

function $(sel) { return document.querySelector(sel); }
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function letters(i) { return "ABCDEF"[i] || "?"; }
function lessonById(id) {
  for (var i = 0; i < COURSE.lessons.length; i++) if (COURSE.lessons[i].id === id) return COURSE.lessons[i];
  return null;
}
function lessonIndex(id) {
  for (var i = 0; i < COURSE.lessons.length; i++) if (COURSE.lessons[i].id === id) return i;
  return -1;
}
function totalMinutes() {
  var t = 0;
  COURSE.lessons.forEach(function (L) { t += L.minutes; });
  return t;
}
function scrollToTop() { try { window.scrollTo(0, 0); } catch (e) {} }
function scrollToFeedback() {
  try {
    var fb = document.querySelector(".feedback");
    if (fb && fb.scrollIntoView) fb.scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (e) {}
}

  var el = $("#toast");

}

var STEPS = [
  { key: "diagnose", label: "摸底" },
  { key: "report", label: "规划" },
  { key: "lessons", label: "学习" },
  { key: "final", label: "测验" }
];

function renderStepper() {
  var host = $("#stepper");
  if (!host) return;
  if (state.stage === "welcome") { host.innerHTML = ""; return; }
  var cur = state.stage;
  if (cur === "lesson") cur = "lessons";
  if (cur === "result") cur = "final";
  var curIdx = 0;
  STEPS.forEach(function (s, i) { if (s.key === cur) curIdx = i; });
  var html = '<ol class="stepper">';
  STEPS.forEach(function (s, i) {
    var cls = i < curIdx ? "done" : (i === curIdx ? "active" : "");
    if (state.stage === "result") cls = "done";
    html += '<li class="' + cls + '"><span class="no">' + (i < curIdx || state.stage === "result" ? "✓" : (i + 1)) + '</span>' + s.label + '</li>';
    if (i < STEPS.length - 1) html += '<span class="sep"></span>';
  });
  html += "</ol>";
  host.innerHTML = html;
}

/* ---------------- 主渲染 ---------------- */
function render(top) {
  var app = $("#app");
  if (!app) return;
  var html = "";
  if (state.stage === "welcome") html = viewWelcome();
  else if (state.stage === "diagnose") html = viewDiagnose();
  else if (state.stage === "report") html = viewReport();
  else if (state.stage === "lessons") html = viewLessons();
  else if (state.stage === "lesson") html = viewLesson();
  else if (state.stage === "final") html = viewFinal();
  else if (state.stage === "result") html = viewResult();
  else html = viewWelcome();
  app.innerHTML = html;
  renderStepper();
  if (top) scrollToTop();
}

  var q = DIAG[idx];
  var answered = Object.prototype.hasOwnProperty.call(state.diag.answers, q.id) ? state.diag.answers[q.id] : null;
  var opts = q.opts.map(function (o, i) {
    var cls = "opt" + (answered === i ? " selected" : "");
    return '<button type="button" class="' + cls + '" data-act="diag-opt" data-i="' + i + '">' +
      '<span class="key">' + letters(i) + '</span><span>' + esc(o) + '</span></button>';
  }).join("");

  var back = idx > 0 ? '<button type="button" class="link" data-act="diag-back">← 上一题</button>' : '<span></span>';

  return '<section class="screen"><div class="card">' +
    '<div class="quiz-head"><span class="meta">摸底 · 第 ' + (idx + 1) + ' / ' + DIAG.length + ' 题</span>' + back + '</div>' +
    '<div class="progress"><i style="width:' + Math.round(((idx) / DIAG.length) * 100) + '%"></i></div>' +
    '<h2 class="q-title">' + esc(q.q) + '</h2>' +
    '<p class="q-hint">答错不扣分，我只想知道你的起点。不确定也可以凭直觉选一个。</p>' +
    '<div class="opts">' + opts + '</div>' +
    '<p class="note">选完自动进入下一题，也可以点「上一题」改答案。</p>' +
    '</div></section>';
}

/* =======================================================================
   诊断报告 + 学习规划
   ======================================================================= */
function skillStats() {
  var map = {};
  COURSE.skillList.forEach(function (s) { map[s.id] = { correct: 0, total: 0 }; });
  DIAG.forEach(function (q) {
    var m = map[q.skill];
    if (!m) return;
    m.total++;
    if (state.diag.answers[q.id] === q.a) m.correct++;
  });
  COURSE.skillList.forEach(function (s) {
    var m = map[s.id];
    m.ratio = m.total ? m.correct / m.total : 0;
    m.level = m.ratio >= 0.75 ? 2 : (m.ratio >= 0.4 ? 1 : 0);
    m.label = m.level === 2 ? "基础稳" : (m.level === 1 ? "有点印象" : "建议从头学");
  });
  return map;
}

function diagCorrectCount() {
  var n = 0;
  DIAG.forEach(function (q) { if (state.diag.answers[q.id] === q.a) n++; });
  return n;
}

function niveau(correct) {
  if (correct <= 2) return {
    k: "zero", label: "几乎零基础 · 从头开始",
    title: "没关系，我们从最基础的地方开始",
    msg: "你几乎没接触过 Python，这完全不是问题。我会把每一步拆得非常小：先讲清楚「为什么」，再给你看例子，然后马上检查一次。看不懂随时可以点「换个更简单的说法」。"
  };
  if (correct <= 5) return {
    k: "mid", label: "有一点基础 · 需要理顺",
    title: "你有零星印象，我们把概念理顺",
    msg: "你听过一些概念，但可能还没有串起来。路线会从最容易混淆的地方（类型、缩进、range 边界）开始，把零散印象变成真正会写的代码。"
  };
  if (correct <= 8) return {
    k: "high", label: "基础不错 · 查漏补缺",
    title: "基础比较扎实，我们补细节",
    msg: "大部分概念你已经会了。简单的课可以快速过，把时间留给还不够熟的部分；建议重点做每节课的小测和最后的结课测验。"
  };
  return {
    k: "high", label: "基础很稳 · 直接冲刺",
    title: "你的基础很稳，可以直接检验成果",
    msg: "摸底几乎全对。你可以直接去结课测验验证实力，也可以快速过一遍课程，把细节和表述再校准一下。"
  };
}

function skillName(id) {
  for (var i = 0; i < COURSE.skillList.length; i++) if (COURSE.skillList[i].id === id) return COURSE.skillList[i].name;
  return "";
}

function planStatus(level) {
  if (level === 0) return { k: "focus", label: "重点学" };
  if (level === 1) return { k: "normal", label: "按计划学" };
  return { k: "fast", label: "可快速过" };
}

function viewReport() {
  var stats = skillStats();
  var correct = diagCorrectCount();
  var nv = niveau(correct);
  var skills = COURSE.skillList.map(function (s) {
    var m = stats[s.id];
    var cls = m.level === 2 ? "high" : (m.level === 1 ? "mid" : "zero");
    return '<div class="skill">' +
      '<div class="row"><b>' + s.name + ' <span style="color:var(--muted);font-weight:400">· ' + s.desc + '</span></b>' +
      '<span class="lv ' + cls + '">' + m.label + ' · ' + m.correct + '/' + m.total + '</span></div>' +
      '<div class="bar"><i class="' + cls + '" style="width:' + Math.round(m.ratio * 100) + '%"></i></div>' +
      '</div>';
  }).join("");

  var plan = COURSE.lessons.map(function (L) {
    var st = planStatus(stats[L.skill].level);
    var rec = state.records[L.id];
    var tag = rec ? '<span class="tag done">已完成 ' + rec.mastery + '%</span>' : '<span class="tag ' + st.k + '">' + st.label + '</span>';
    return '<li><span class="no">' + L.no + '</span>' +
      '<div class="body"><b>' + esc(L.title) + '</b><small>' + esc(L.goal) + ' · 约 ' + L.minutes + ' 分钟</small></div>' +
      tag + '</li>';
  }).join("");

  return '<section class="screen"><div class="card">' +
    '<div class="report-hero">' +
      '<span class="level-badge ' + nv.k + '">🎯 你的起点：' + nv.label + '（摸底 ' + correct + '/' + DIAG.length + '）</span>' +
      '<h1>' + nv.title + '</h1>' +
      '<p>' + nv.msg + '</p>' +
    '</div>' +
    '<div class="divider"></div>' +
    '<p class="kicker"><span class="dot"></span>四个能力维度</p>' +
    '<div class="skill-list">' + skills + '</div>' +
    '<div class="divider"></div>' +
    '<p class="kicker"><span class="dot"></span>为你排好的路线</p>' +
    '<ul class="plan">' + plan + '</ul>' +
    '<div class="plan-summary">' +
      '<span>共 <b>' + COURSE.lessons.length + '</b> 节课</span>' +
      '<span>预计 <b>' + totalMinutes() + '</b> 分钟</span>' +
      '<span>每节课都有 <b>讲解 · 检查 · 建议提问 · 小测</b></span>' +
    '</div>' +
    '<div class="actions">' +
      '<button type="button" class="btn primary big" data-act="to-lessons">开始学习 →</button>' +
      '<button type="button" class="btn big" data-act="rediagnose">重新摸底</button>' +
    '</div>' +
    '<p class="note">提示：标「可快速过」的课也别跳过小测，那是检验细节的地方。</p>' +
    '</div></section>';
}

/* =======================================================================
   课程列表
   ======================================================================= */
function viewLessons() {
  var done = 0, masterySum = 0;
  COURSE.lessons.forEach(function (L) {
    var r = state.records[L.id];
    if (r) { done++; masterySum += r.mastery || 0; }
  });
  var avg = done ? Math.round(masterySum / done) : 0;

  var items = COURSE.lessons.map(function (L) {
    var rec = state.records[L.id];
    var right;
    if (rec) right = '<span class="pct">✓ ' + rec.mastery + '%</span><span class="mi">已完成</span>';
    else if (state.lesson && state.lesson.id === L.id) right = '<span class="mi">进行中</span><span class="mi">继续 →</span>';
    else right = '<span class="mi">约 ' + L.minutes + ' 分钟</span><span class="mi">' + L.cards.length + ' 步讲解</span>';
    return '<button type="button" class="lesson-item' + (rec ? " finished" : "") + '" data-act="open-lesson" data-id="' + L.id + '">' +
      '<span class="no">' + (rec ? "✓" : L.no) + '</span>' +
      '<span class="body"><b>' + esc(L.title) + '</b><small>' + esc(L.goal) + '</small></span>' +
      '<span class="right">' + right + '</span>' +
      '</button>';
  }).join("");

  return '<section class="screen">' +
    '<div class="course-overview">' +
      '<div><h1>学习路线</h1><p>' + esc(COURSE.title) + ' · ' + esc(COURSE.subtitle) + '</p></div>' +
      '<div class="overall">已完成 <b>' + done + ' / ' + COURSE.lessons.length + '</b>' + (done ? "平均掌握度 " + avg + "%" : "从第 1 节开始") + '</div>' +
    '</div>' +
    '<div class="lesson-list mt24">' + items + '</div>' +
    '<div class="actions mt24">' +
      '<button type="button" class="btn primary" data-act="go-final">去做结课测验 →</button>' +
      '<button type="button" class="btn ghost" data-act="back-report">看看我的诊断报告</button>' +
    '</div>' +
    '<p class="note">建议按顺序学。每节课做完小测才算完成，进度会自动保存。</p>' +
    '</section>';
}

/* =======================================================================
   上课
   ======================================================================= */
function lessonUnits(L, ls) {
  var total = L.cards.length + 2 + L.quiz.length;
  var u = 0;
  if (ls.phase === "cards") u = ls.idx;
  else if (ls.phase === "summary") u = L.cards.length;
  else if (ls.phase === "asks") u = L.cards.length + 1;
  else if (ls.phase === "quiz") u = L.cards.length + 2 + ls.quizIdx;
  else u = total;
  return { u: u, total: total, pct: Math.round((u / total) * 100) };
}

function viewLesson() {
  var ls = state.lesson;
  if (!ls) { state.stage = "lessons"; return viewLessons(); }
  var L = lessonById(ls.id);
  if (!L) { state.stage = "lessons"; return viewLessons(); }
  if (["cards", "summary", "asks", "quiz", "done"].indexOf(ls.phase) < 0) ls.phase = "cards";
  /* 兼容旧存档缺字段 */
  if (!ls.checks || typeof ls.checks !== "object") ls.checks = {};
  if (!ls.simple || typeof ls.simple !== "object") ls.simple = {};
  if (!ls.quiz || typeof ls.quiz !== "object") ls.quiz = {};
  if (!ls.hint || typeof ls.hint !== "object") ls.hint = {};
  ls.idx = ls.idx || 0;
  ls.quizIdx = ls.quizIdx || 0;

  var units = lessonUnits(L, ls);
  var head = '<div class="lesson-top">' +
    '<button type="button" class="link" data-act="lesson-exit">← 返回课程列表</button>' +
    '<span class="steps-ind">第 ' + L.no + ' / ' + COURSE.lessons.length + ' 节 · 进度 ' + units.pct + '%</span>' +
    '</div><div class="lesson-progress"><i style="width:' + units.pct + '%"></i></div>';

  var body = "";
  if (ls.phase === "cards") body = lessonCard(L, ls);
  else if (ls.phase === "summary") body = lessonSummary(L, ls);
  else if (ls.phase === "asks") body = lessonAsks(L, ls);
  else if (ls.phase === "quiz") body = lessonQuiz(L, ls);
  else body = lessonDone(L, ls);

  return '<section class="screen">' + head + '<div class="card">' + body + '</div></section>';
}

function lessonCard(L, ls) {
  var i = ls.idx, c = L.cards[i];
  var ans = ls.checks[i];
  var showSimple = !!ls.simple[i];

  var bodyP = c.p.map(function (t) {
    var safe = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    return '<p>' + safe + '</p>';
  }).join("");

  var code = "";
  if (c.code) {
    code = '<div class="code-wrap"><pre class="code"><code>' + esc(c.code) + "</code></pre>";
    if (c.out) code += '<div class="out"><span class="out-label">输出</span><pre>' + esc(c.out) + "</pre></div>";
    code += "</div>";
  }

  var simpleBtn = '<button type="button" class="link" data-act="simple" data-i="' + i + '">' +
    (showSimple ? "收起简单解释" : "🤔 没太懂？换个更简单的说法") + "</button>";
  var simpleBox = showSimple ? '<div class="simple"><b>再讲一遍：</b>' + esc(c.simple) + "</div>" : "";

  var chk = c.check;
  var checkHtml;
  if (!ans) {
    var optHtml = chk.opts.map(function (o, j) {
      return '<button type="button" class="opt" data-act="check" data-i="' + j + '">' +
        '<span class="key">' + letters(j) + '</span><span>' + esc(o) + "</span></button>";
    }).join("");
    checkHtml = '<div class="check">' +
      '<p class="kicker"><span class="dot"></span>停一下，检查一下</p>' +
      "<h3>" + esc(chk.q) + "</h3>" +
      '<div class="opts">' + optHtml + "</div>" +
      "</div>";
  } else {
    var fbOpts = chk.opts.map(function (o, j) {
      var cls = "opt static";
      if (j === chk.a) cls += " right";
      else if (j === ans.i) cls += " wrong";
      else cls += " dim";
      return '<button type="button" class="' + cls + '"><span class="key">' + letters(j) + "</span><span>" + esc(o) + "</span></button>";
    }).join("");
    checkHtml = '<div class="check">' +
      '<p class="kicker"><span class="dot"></span>检查结果</p>' +
      '<div class="opts">' + fbOpts + "</div>" +
      '<div class="feedback ' + (ans.ok ? "ok" : "bad") + '">' +
        '<p class="fb-title">' + (ans.ok ? "✅ 就是这样，你抓到关键了" : "💡 差一点点，我们一起看") + "</p>" +
        (ans.ok ? "" : '<p>正确答案是 <b>' + letters(chk.a) + ". " + esc(chk.opts[chk.a]) + "</b></p>") +
        "<p>" + esc(chk.explain) + "</p>" +
        '<button type="button" class="btn primary" data-act="card-next">' +
          (i === L.cards.length - 1 ? "下一步：本课小结 →" : "懂了，继续下一步 →") +
        "</button>" +
        '<button type="button" class="btn ghost" data-act="card-retry" data-i="' + i + '">再看一遍这张讲解</button>' +
      "</div></div>";
  }

  return '<p class="lesson-title">第 ' + (i + 1) + " / " + L.cards.length + " 步讲解 · " + esc(L.title) + "</p>" +
    '<div class="card-stage">' +
      "<h2>" + esc(c.h) + "</h2>" + bodyP + code + simpleBtn + simpleBox +
    "</div>" + checkHtml;
}

function lessonSummary(L, ls) {
  var lis = L.summary.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("");
  return '<p class="lesson-title">' + esc(L.title) + " · 本课小结</p>" +
    '<div class="card-stage"><h2>这节课你学会了什么</h2>' +
      '<div class="summary-box"><h3>📌 记住这 ' + L.summary.length + ' 句话就够了</h3><ul>' + lis + "</ul></div>" +
      '<p class="note">如果还有哪里卡着，下一节「你可能会问」里先看看，也许答案就在那。</p>' +
      '<div class="actions"><button type="button" class="btn primary" data-act="goto-asks">下一节：你可能会问 →</button>' +
      '<button type="button" class="btn ghost" data-act="card-prev">← 回去再看一遍</button></div>' +
    "</div>";
}

function lessonAsks(L, ls) {
  var asks = L.asks.map(function (a) {
    return '<details class="ask"><summary>' + esc(a.q) + '</summary><div class="answer">' + esc(a.a) + "</div></details>";
  }).join("");
  return '<p class="lesson-title">' + esc(L.title) + " · 你可能会问</p>" +
    '<div class="card-stage"><h2>这些问题，先替你想好了</h2>' +
      '<p>点开看答案。看完了还没懂，回到上一节再看一遍讲解，或者把问题记下来之后问我。</p>' +
      '<div class="asks">' + asks + "</div>" +
      '<div class="actions"><button type="button" class="btn primary" data-act="goto-quiz">我已看完，进入本课小测 →</button></div>' +
    "</div>";
}

function lessonQuiz(L, ls) {
  var qi = ls.quizIdx;
  var q = L.quiz[qi];
  var ans = ls.quiz[qi];
  var hintShown = !!ls.hint[qi];

  var optHtml = q.opts.map(function (o, j) {
    var cls = "opt";
    if (!ans) cls += "";
    else {
      cls = "opt static";
      if (j === q.a) cls += " right";
      else if (j === ans.i) cls += " wrong";
      else cls += " dim";
    }
    var act = ans ? "" : ' data-act="quiz-opt" data-i="' + j + '"';
    return '<button type="button" class="' + cls + '"' + act + '><span class="key">' + letters(j) + "</span><span>" + esc(o) + "</span></button>";
  }).join("");

  var hintBtn = !ans ? '<button type="button" class="link" data-act="hint" data-i="' + qi + '">💡 给点提示</button>' : "";
  var hintBox = hintShown && !ans ? '<div class="simple"><b>提示：</b>' + esc(q.hint) + "</div>" : "";

  var fb = "";
  if (ans) {
    fb = '<div class="feedback ' + (ans.ok ? "ok" : "bad") + '">' +
      '<p class="fb-title">' + (ans.ok ? "✅ 答对了" : "💡 这题容易踩坑") + "</p>" +
      (ans.ok ? "" : '<p>正确答案是 <b>' + letters(q.a) + ". " + esc(q.opts[q.a]) + "</b></p>") +
      "<p>" + esc(q.explain) + "</p>" +
      '<button type="button" class="btn primary" data-act="quiz-next">' +
        (qi === L.quiz.length - 1 ? "完成本课，看结果 →" : "下一题 →") +
      "</button></div>";
  }

  return '<p class="lesson-title">' + esc(L.title) + " · 本课小测 " + (qi + 1) + " / " + L.quiz.length + "</p>" +
    '<div class="card-stage"><h2>' + esc(q.q) + "</h2>" +
      hintBtn + hintBox +
      '<div class="opts">' + optHtml + "</div>" + fb +
    "</div>";
}

function lessonDone(L, ls) {
  var total = L.cards.length + L.quiz.length;
  var ok = 0;
  for (var i = 0; i < L.cards.length; i++) if (ls.checks[i] && ls.checks[i].ok) ok++;
  for (var j = 0; j < L.quiz.length; j++) if (ls.quiz[j] && ls.quiz[j].ok) ok++;
  var rec = state.records[L.id] || { mastery: Math.round((ok / total) * 100) };
  var mastery = rec.mastery;
  var title, msg;
  if (mastery === 100) { title = "满分通过，这一课真的懂了 🎉"; msg = "每一道检查都答对了。可以放心进入下一课。"; }
  else if (mastery >= 70) { title = "这节课过关了"; msg = "大部分都答对了。错的那题记住解释就行，不用重来。"; }
  else { title = "先别急着走，再稳一下"; msg = "正确率还不太够。建议回去把讲解再过一遍，特别是答错的那几步——基础打牢后面会轻松很多。"; }

  var next = lessonIndex(L.id) + 1;
  var nextL = next < COURSE.lessons.length ? COURSE.lessons[next] : null;
  var buttons = "";
  if (mastery < 70) {
    buttons += '<button type="button" class="btn primary" data-act="review-lesson">再学一遍这节课</button>';
  }
  if (nextL) {
    buttons += '<button type="button" class="btn ' + (mastery >= 70 ? "primary" : "") + '" data-act="next-lesson" data-id="' + nextL.id + '">下一课：' + esc(nextL.title) + " →</button>";
  } else {
    buttons += '<button type="button" class="btn primary" data-act="go-final">全部学完，去结课测验 →</button>';
  }
  buttons += '<button type="button" class="btn ghost" data-act="lesson-exit">返回课程列表</button>';

  return '<div class="done-hero">' +
      '<div class="score-ring" style="--p:' + mastery + '"><div class="in"><div><b>' + mastery + '%</b><span>本课掌握度</span></div></div></div>' +
      "<h1>" + title + "</h1>" +
      "<p>" + msg + "</p>" +
      '<p class="note">答对 ' + ok + " / " + total + " 个检查点 · 约 " + L.minutes + " 分钟</p>" +
    "</div>" +
    '<div class="divider"></div>' +
    '<div class="summary-box"><h3>📌 本课要点回顾</h3><ul>' +
      L.summary.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") +
    "</ul></div>" +
    '<div class="actions">' + buttons + "</div>";
}

/* =======================================================================
   结课测验
   ======================================================================= */
function viewFinal() {
  var idx = state.final.idx;
  var q = FINAL[idx];
  var chosen = Object.prototype.hasOwnProperty.call(state.final.answers, q.id) ? state.final.answers[q.id] : null;
  var answeredCount = Object.keys(state.final.answers).length;

  var opts = q.opts.map(function (o, i) {
    return '<button type="button" class="opt' + (chosen === i ? " selected" : "") + '" data-act="final-opt" data-i="' + i + '">' +
      '<span class="key">' + letters(i) + "</span><span>" + esc(o) + "</span></button>";
  }).join("");

  var nav = "";
  if (idx > 0) nav += '<button type="button" class="btn ghost" data-act="final-prev">← 上一题</button>';
  if (idx < FINAL.length - 1) nav += '<button type="button" class="btn primary" data-act="final-next">下一题 →</button>';
  else nav += '<button type="button" class="btn primary" data-act="final-submit">提交答案，看成绩</button>';

  return '<section class="screen"><div class="card">' +
    '<div class="quiz-head"><span class="meta">结课测验 · 第 ' + (idx + 1) + " / " + FINAL.length + " 题</span>" +
      '<span class="meta">已答 ' + answeredCount + " / " + FINAL.length + "</span></div>" +
    '<div class="progress"><i style="width:' + Math.round(((idx) / FINAL.length) * 100) + '%"></i></div>' +
    '<h2 class="q-title">' + esc(q.q) + "</h2>" +
    '<p class="q-hint">这次不即时反馈，交卷后统一出分，并逐题解析。答案可以随时改。</p>' +
    '<div class="opts">' + opts + "</div>" +
    '<div class="actions right">' + nav + "</div>" +
    '<p class="note">满分 ' + FINAL.length + " 题，答对 80% 以上算通过。</p>" +
    "</div></section>";
}

/* =======================================================================
   成绩 + 逐题解析
   ======================================================================= */
function viewResult() {
  var correct = 0;
  FINAL.forEach(function (q) { if (state.final.answers[q.id] === q.a) correct++; });
  var score = Math.round((correct / FINAL.length) * 100);
  var pass = score >= 80;

  var skillMap = {};
  COURSE.skillList.forEach(function (s) { skillMap[s.id] = { correct: 0, total: 0 }; });
  FINAL.forEach(function (q) {
    var m = skillMap[q.skill];
    m.total++;
    if (state.final.answers[q.id] === q.a) m.correct++;
  });
  var skills = COURSE.skillList.map(function (s) {
    var m = skillMap[s.id];
    var ratio = m.total ? m.correct / m.total : 0;
    var cls = ratio >= 0.75 ? "high" : (ratio >= 0.4 ? "mid" : "zero");
    var label = ratio >= 0.75 ? "掌握" : (ratio >= 0.4 ? "半熟" : "要补");
    return '<div class="skill"><div class="row"><b>' + s.name + '</b><span class="lv ' + cls + '">' + label + " · " + m.correct + "/" + m.total + "</span></div>" +
      '<div class="bar"><i class="' + cls + '" style="width:' + Math.round(ratio * 100) + '%"></i></div></div>';
  }).join("");

  var review = FINAL.map(function (q, i) {
    var chosen = state.final.answers[q.id];
    var ok = chosen === q.a;
    var chosenText = chosen == null ? "未作答" : letters(chosen) + ". " + q.opts[chosen];
    return '<li class="' + (ok ? "right" : "wrong") + '">' +
      '<p class="rq"><span class="mark">' + (ok ? "✅" : "❌") + "</span><span>" + (i + 1) + ". " + esc(q.q) + "</span></p>" +
      '<p class="ra">你的答案：<b>' + esc(chosenText) + "</b>" +
      (ok ? "" : "　正确答案：<b>" + letters(q.a) + ". " + esc(q.opts[q.a]) + "</b>") + "</p>" +
      '<p class="explain">' + esc(q.explain) + "</p>" +
      "</li>";
  }).join("");

  var weakSkills = [];
  COURSE.skillList.forEach(function (s) {
    var m = skillMap[s.id];
    if (m.total && m.correct / m.total < 0.75) weakSkills.push(s.id);
  });
  var needLessons = COURSE.lessons.filter(function (L) { return weakSkills.indexOf(L.skill) >= 0; });
  var reviewBlock = "";
  if (needLessons.length) {
    reviewBlock = '<div class="summary-box"><h3>📚 建议复习这几节</h3><ul>' +
      needLessons.map(function (L) {
        return '<li>第 ' + L.no + " 课 · " + esc(L.title) + "（" + esc(skillName(L.skill)) + "）</li>";
      }).join("") +
      "</ul></div>";
  }

  var lessonCount = Object.keys(state.records).length;

  return '<section class="screen">' +
    '<div class="card">' +
      '<div class="done-hero">' +
        '<div class="score-ring" style="--p:' + score + '"><div class="in"><div><b>' + score + "%</b><span>结课成绩</span></div></div></div>" +
        '<span class="level-badge ' + (pass ? "high" : "mid") + '">' + (pass ? "🎓 通过 · 你已经入门了" : "💪 还没到 80%，再练一轮") + "</span>" +
        "<h1>" + (pass ? "你真的学会基础 Python 了" : "差一点，先补上薄弱的那一块") + "</h1>" +
        "<p>" + (pass
          ? "现在你能读懂基础代码、自己写循环和函数，也完成过一个小项目。接下来可以试试把你生活里的一个小需求写成程序。"
          : "别灰心，答案和解析都在下面。对着错的题回到对应课程再看一遍，第二次考一定会好很多。") + "</p>" +
        '<p class="note">答对 ' + correct + " / " + FINAL.length + " 题 · 已学完 " + lessonCount + " / " + COURSE.lessons.length + " 节课</p>" +
      "</div>" +
      '<div class="divider"></div>' +
      '<p class="kicker"><span class="dot"></span>各维度得分</p>' +
      '<div class="skill-list">' + skills + "</div>" +
      reviewBlock +
      '<div class="divider"></div>' +
      '<p class="kicker"><span class="dot"></span>逐题解析</p>' +
      '<ul class="review-list">' + review + "</ul>" +
      '<div class="actions">' +
        '<button type="button" class="btn ' + (pass ? "" : "primary") + '" data-act="retake-final">再考一次</button>' +
        '<button type="button" class="btn" data-act="to-lessons">回到课程目录</button>' +
        '<button type="button" class="btn ghost" data-act="restart">从头开始</button>' +
      "</div>" +
    "</div></section>";
}

/* =======================================================================
   交互处理
   ======================================================================= */
function handle(act, i, el) {
  var L, ls, q;

  if (act === "start") {
    state.diag = { idx: 0, answers: {} };
    state.diagCompleted = false;
    state.stage = "diagnose";
    saveState(); render(true);
    return;
  }
  if (act === "resume") {
    state.stage = resumeTarget();
    saveState(); render(true);
    return;
  }
  if (act === "outline") {
    var box = document.getElementById("outlineBox");
    if (box && box.scrollIntoView) box.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (act === "diag-opt") { answerDiag(i); return; }
  if (act === "diag-back") {
    if (state.diag.idx > 0) { state.diag.idx--; saveState(); render(true); }
    return;
  }
  if (act === "rediagnose") {
    state.diag = { idx: 0, answers: {} };
    state.diagCompleted = false;
    state.stage = "diagnose";
    saveState(); render(true);
    return;
  }
  if (act === "to-lessons") {
    state.stage = "lessons"; saveState(); render(true);
    return;
  }
  if (act === "back-report") {
    state.stage = "report"; saveState(); render(true);
    return;
  }
  if (act === "go-final") {
    if (state.final.submitted) {
      state.stage = "result";
    } else {
      if (Object.keys(state.final.answers).length === 0) state.final.idx = 0;
      state.stage = "final";
    }
    saveState(); render(true);
    return;
  }
  if (act === "open-lesson") {
    openLesson(el ? el.getAttribute("data-id") : null);
    return;
  }
  if (act === "lesson-exit") {
    state.stage = "lessons"; saveState(); render(true);
    return;
  }
  if (act === "simple") {
    if (!state.lesson) return;
    var si = Number(i);
    state.lesson.simple[si] = !state.lesson.simple[si];
    saveState(); render(false);
    return;
  }
  if (act === "check") { answerCardCheck(Number(i)); return; }
  if (act === "card-retry") {
    if (!state.lesson) return;
    delete state.lesson.checks[Number(i)];
    saveState(); render(false); scrollToTop();
    toast("再看一遍这张讲解，懂了再答");
    return;
  }
  if (act === "card-next") { nextCard(); return; }
  if (act === "card-prev") {
    ls = state.lesson;
    if (!ls) return;
    if (ls.phase === "summary") { ls.phase = "cards"; ls.idx = lessonById(ls.id).cards.length - 1; }
    else if (ls.idx > 0) ls.idx--;
    saveState(); render(true);
    return;
  }
  if (act === "goto-asks") {
    if (state.lesson) state.lesson.phase = "asks";
    saveState(); render(true);
    return;
  }
  if (act === "goto-quiz") {
    if (state.lesson) { state.lesson.phase = "quiz"; state.lesson.quizIdx = 0; }
    saveState(); render(true);
    return;
  }
  if (act === "hint") {
    if (!state.lesson) return;
    state.lesson.hint[Number(i)] = true;
    saveState(); render(false);
    return;
  }
  if (act === "quiz-opt") { answerLessonQuiz(Number(i)); return; }
  if (act === "quiz-next") {
    ls = state.lesson;
    if (!ls) return;
    L = lessonById(ls.id);
    if (ls.quizIdx < L.quiz.length - 1) { ls.quizIdx++; saveState(); render(true); }
    else finishLesson();
    return;
  }
  if (act === "review-lesson") {
    ls = state.lesson;
    if (!ls) return;
    ls.phase = "cards"; ls.idx = 0; ls.checks = {}; ls.quiz = {}; ls.quizIdx = 0; ls.hint = {};
    saveState(); render(true);
    toast("重新开始这一课");
    return;
  }
  if (act === "next-lesson") {
    openLesson(el ? el.getAttribute("data-id") : null);
    return;
  }
  if (act === "final-opt") {
    q = FINAL[state.final.idx];
    state.final.answers[q.id] = Number(i);
    saveState(); render(false);
    return;
  }
  if (act === "final-prev") {
    if (state.final.idx > 0) { state.final.idx--; saveState(); render(true); }
    return;
  }
  if (act === "final-next") {
    if (state.final.idx < FINAL.length - 1) { state.final.idx++; saveState(); render(true); }
    return;
  }
  if (act === "final-submit") {
    var unanswered = FINAL.length - Object.keys(state.final.answers).length;
    if (unanswered > 0 && !confirm("还有 " + unanswered + " 题没答，未答的会算错。确定现在交卷吗？")) return;
    state.final.submitted = true;
    state.stage = "result";
    saveState(); render(true);
    return;
  }
  if (act === "retake-final") {
    state.final = { idx: 0, answers: {}, submitted: false };
    state.stage = "final";
    saveState(); render(true);
    return;
  }
  if (act === "restart") { restartAll(); return; }
}

function resumeTarget() {
  if (state.final.submitted) return "result";
  if (state.lesson) return "lesson";
  if (state.diagCompleted) return "lessons";
  return "diagnose";
}

function restartAll() {
  if (!confirm("会清空摸底结果、课程进度和成绩，全部从头开始。确定吗？")) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  state = defaultState();
  render(true);
  toast("已重置，从头开始");
}

function answerDiag(i) {
  if (lock) return;
  var q = DIAG[state.diag.idx];
  state.diag.answers[q.id] = i;
  saveState();
  lock = true;
  render(false);
  setTimeout(function () {
    lock = false;
    if (state.diag.idx < DIAG.length - 1) {
      state.diag.idx++;
      saveState();
      render(true);
    } else {
      state.diagCompleted = true;
      state.stage = "report";
      saveState();
      render(true);
    }
  }, 240);
}

function openLesson(id) {
  var L = lessonById(id);
  if (!L) return;
  state.lesson = {
    id: L.id, phase: "cards", idx: 0,
    checks: {}, simple: {}, quiz: {}, quizIdx: 0, hint: {}
  };
  state.stage = "lesson";
  saveState();
  render(true);
}

function answerCardCheck(optIdx) {
  var ls = state.lesson;
  if (!ls) return;
  var L = lessonById(ls.id);
  var card = L.cards[ls.idx];
  ls.checks[ls.idx] = { i: optIdx, ok: optIdx === card.check.a };
  saveState();
  render(false);
  scrollToFeedback();
}

function nextCard() {
  var ls = state.lesson;
  if (!ls) return;
  var L = lessonById(ls.id);
  if (ls.idx < L.cards.length - 1) {
    ls.idx++;
    saveState();
    render(true);
  } else {
    ls.phase = "summary";
    saveState();
    render(true);
  }
}

function answerLessonQuiz(optIdx) {
  var ls = state.lesson;
  if (!ls) return;
  var L = lessonById(ls.id);
  var q = L.quiz[ls.quizIdx];
  ls.quiz[ls.quizIdx] = { i: optIdx, ok: optIdx === q.a };
  saveState();
  render(false);
  scrollToFeedback();
}

function finishLesson() {
  var ls = state.lesson;
  if (!ls) return;
  var L = lessonById(ls.id);
  var total = L.cards.length + L.quiz.length;
  var ok = 0;
  for (var i = 0; i < L.cards.length; i++) if (ls.checks[i] && ls.checks[i].ok) ok++;
  for (var j = 0; j < L.quiz.length; j++) if (ls.quiz[j] && ls.quiz[j].ok) ok++;
  state.records[L.id] = { mastery: Math.round((ok / total) * 100), ok: ok, total: total, at: Date.now() };
  ls.phase = "done";
  saveState();
  render(true);
}

/* 事件委托 */
document.addEventListener("click", function (e) {
  var t = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if (!t) return;
  var act = t.getAttribute("data-act");
  var i = t.getAttribute("data-i");
  handle(act, i, t);
});

/* 启动 */
render(true);
</script>
